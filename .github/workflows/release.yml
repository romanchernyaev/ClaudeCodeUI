name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller pywebview Pillow openpyxl python-docx pypdf odfpy python-pptx

      - name: Stamp version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          Set-Content -Path backend\version.py -Value "__version__ = `"$tag`"`n"
          Get-Content backend\version.py

      - name: Build portable exe
        shell: cmd
        run: build.bat

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path dist\ClaudeCodeUI.exe -DestinationPath dist\ClaudeCodeUI.zip -Force

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ClaudeCodeUI.exe
            dist/ClaudeCodeUI.zip
          generate_release_notes: true
